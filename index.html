<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230a8a3c'/%3E%3Ctext x='32' y='42' font-size='28' text-anchor='middle' fill='%23fff' font-family='sans-serif' font-weight='bold'%3E电%3C/text%3E%3C/svg%3E">
<title>国网西安供电公司 · 24小时服务热线</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; overflow:hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background:#06333a;
  color:#1a2b2a;
  -webkit-font-smoothing:antialiased;
  user-select:none;
  -webkit-user-select:none;
}
a { text-decoration:none; color:inherit; display:block; }

#stage {
  position:relative;
  width:100%;
  max-width:480px;
  height:100%;
  height:100dvh;
  margin:0 auto;
  overflow:hidden;
  background:linear-gradient(168deg,#0b8f7b 0%,#12b5a5 38%,#7fd8cd 72%,#cdeeea 100%);
  box-shadow:0 0 60px rgba(0,0,0,.5);
}

.page {
  position:absolute; inset:0;
  width:100%; height:100%;
  transition:transform .55s cubic-bezier(.22,.9,.3,1), opacity .55s ease;
  will-change:transform;
}

/* ============ 通用 ============ */
.pin {
  position:relative; display:inline-block;
  width:.62rem; height:.62rem; border-radius:50%;
  background:#e8402f; border:.14rem solid #fff;
  box-shadow:0 0 0 .12rem rgba(232,64,47,.55), 0 .08rem .2rem rgba(0,0,0,.3);
}
.pin::after {
  content:""; position:absolute; inset:-.42rem; border-radius:50%;
  border:.12rem solid rgba(232,64,47,.65);
  animation:pulse 1.8s ease-out infinite;
}
@keyframes pulse {
  0%   { transform:scale(.4); opacity:1; }
  100% { transform:scale(1.25); opacity:0; }
}

/* ============ 第1页 宣传首页 ============ */
#page-cover {
  z-index:1;
  display:flex; flex-direction:column;
  transform:translateY(0);
}
#page-cover.away { transform:translateY(-100%); }

.deco-circle { position:absolute; border-radius:50%; background:rgba(255,255,255,.08); pointer-events:none; }

.cover-head {
  padding:calc(env(safe-area-inset-top,0px) + 4.5vh) 6vw 0;
  display:flex; align-items:center; gap:3vw;
  animation:fadeDown .8s ease both;
}
.logo-badge {
  width:3.4rem; height:3.4rem; flex:0 0 auto;
  filter:drop-shadow(0 .15rem .4rem rgba(0,60,50,.35));
}
.cover-org { color:#fff; }
.cover-org .cn { font-size:1.28rem; font-weight:700; letter-spacing:.12em; text-shadow:0 .1rem .3rem rgba(0,70,60,.4); }
.cover-org .en { font-size:.58rem; letter-spacing:.22em; opacity:.85; margin-top:.28rem; }

.cover-title {
  margin-top:5vh; text-align:center; color:#fff;
  animation:fadeDown .8s .15s ease both;
}
.cover-title .t24 {
  font-size:3.4rem; font-weight:800; line-height:1;
  letter-spacing:.04em;
  text-shadow:0 .2rem .6rem rgba(0,80,70,.45);
}
.cover-title .t24 small { font-size:1.3rem; font-weight:700; vertical-align:.5rem; letter-spacing:.1em; }
.cover-title .tsub { margin-top:1.6vh; font-size:1.42rem; letter-spacing:.34em; text-indent:.34em; font-weight:600; text-shadow:0 .12rem .4rem rgba(0,80,70,.4); }
.cover-hotline {
  display:inline-flex; align-items:center; gap:.5em;
  margin-top:2.2vh; padding:.55em 1.3em;
  background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.55);
  border-radius:2em; color:#fff;
  font-size:.92rem; letter-spacing:.14em;
  backdrop-filter:blur(4px);
}
.cover-hotline b { font-size:1.06rem; letter-spacing:.06em; }

.cover-art { flex:1; position:relative; min-height:0; animation:fadeUp 1s .3s ease both; }
.cover-art svg { position:absolute; bottom:0; left:0; width:100%; height:100%; }

.flip-btn {
  position:relative; z-index:2;
  margin:0 auto calc(env(safe-area-inset-bottom,0px) + 3.2vh);
  padding:.9em 2.6em .8em;
  border:none; border-radius:2.2em;
  background:#fff; color:#0a8a78;
  font-size:1.02rem; font-weight:700; letter-spacing:.22em; text-indent:.22em;
  box-shadow:0 .4rem 1.2rem rgba(0,70,60,.35);
  cursor:pointer;
  animation:fadeUp .8s .5s ease both;
  display:flex; flex-direction:column; align-items:center; gap:.15rem;
}
.flip-btn .chev { width:1.1rem; height:.7rem; animation:chevUp 1.4s ease-in-out infinite; }
@keyframes chevUp { 0%,100%{transform:translateY(.18rem);opacity:.5} 50%{transform:translateY(-.12rem);opacity:1} }
@keyframes fadeDown { from{opacity:0;transform:translateY(-1.4rem)} to{opacity:1;transform:none} }
@keyframes fadeUp { from{opacity:0;transform:translateY(1.4rem)} to{opacity:1;transform:none} }

/* ============ 第2页 地图页 ============ */
#page-map {
  z-index:1;
  display:flex; flex-direction:column;
  transform:translateY(100%);
}
#page-map.show { transform:translateY(0); }

#page-map { background:linear-gradient(180deg,#4dbaad 0%,#8ed6cb 45%,#d8f2ed 100%); }

.map-head {
  padding:calc(env(safe-area-inset-top,0px) + 2.6vh) 5vw 0;
  text-align:center;
}
.map-head h2 { display:flex; justify-content:center; align-items:center; gap:.42rem; }
.map-head h2 span {
  display:inline-flex; align-items:center; justify-content:center;
  min-width:2.5rem; height:2.7rem; padding:0 .3rem;
  background:#fff; border-radius:.55rem;
  color:#0d8a78; font-size:1.5rem; font-weight:800;
  box-shadow:0 .22rem .5rem rgba(6,90,80,.30), inset 0 -.18rem 0 #bfe6de;
}
.map-head h2 span.dot {
  min-width:auto; padding:0; background:none; box-shadow:none;
  color:#fff; font-size:1.6rem; text-shadow:0 .12rem .3rem rgba(6,90,80,.45);
}
.map-cta {
  display:inline-flex; align-items:center; gap:.6rem;
  margin-top:1.8vh; padding:.5rem 1.4rem .5rem .95rem;
  background:linear-gradient(135deg,rgba(255,255,255,.5),rgba(255,255,255,.22));
  border:2px solid rgba(255,255,255,.9);
  border-radius:3rem;
  box-shadow:0 .3rem .9rem rgba(6,90,80,.28), inset 0 0 1.2rem rgba(255,255,255,.25);
  backdrop-filter:blur(3px);
}
.map-cta svg { width:1.45rem; height:1.85rem; flex:0 0 auto; filter:drop-shadow(0 .12rem .2rem rgba(0,60,50,.3)); }
.map-cta .tt {
  text-align:left; color:#fff; font-weight:800; font-size:.95rem;
  letter-spacing:.1em; line-height:1.45;
  text-shadow:0 .1rem .25rem rgba(6,90,80,.5);
}

.map-body { flex:1; position:relative; min-height:0; padding:0 2vw; }
.map-body svg { width:100%; height:100%; display:block; }

.region { cursor:pointer; }
.region path {
  fill:url(#rg);
  stroke:#ffffff; stroke-width:1.6; stroke-linejoin:round;
  transition:fill .25s, opacity .25s;
}
.region:active path { fill:#2b9c8c; }
.rlab {
  fill:#ffffff; font-size:13px; font-weight:700; pointer-events:none;
  paint-order:stroke; stroke:rgba(7,85,75,.55); stroke-width:3px; stroke-linejoin:round;
}
.rlab.jingwei { fill:#e8402f; font-size:10px; stroke-width:2px; stroke:#fff; }
.rlab.sm { font-size:9px; stroke-width:2.5px; }
.pin-g circle { pointer-events:none; }
.pin-g { pointer-events:all; }
.pin-g path { fill:#e8402f; stroke:#fff; stroke-width:1.6; }
.pin-g:active path { fill:#c22d1f; }

.map-foot {
  padding:1vh 6vw calc(env(safe-area-inset-bottom,0px) + 2.2vh);
  text-align:center; color:#fff; font-size:.74rem; letter-spacing:.12em;
  text-shadow:0 .08rem .25rem rgba(6,90,80,.45);
}

/* ============ 第3页 区县详情页 ============ */
#page-detail {
  z-index:2;
  background:linear-gradient(175deg,#0b8f7b 0%,#12b5a5 30vh,#eef7f5 30.2vh,#eef7f5 100%);
  transform:translateX(100%);
  display:flex; flex-direction:column;
}
#page-detail.show { transform:translateX(0); }

.d-head {
  padding:calc(env(safe-area-inset-top,0px) + 1.6vh) 4vw 2vh;
  color:#fff; position:relative;
}
.d-back {
  display:inline-flex; align-items:center; gap:.3em;
  border:1px solid rgba(255,255,255,.6); background:rgba(255,255,255,.14);
  color:#fff; font-size:.8rem; letter-spacing:.08em;
  padding:.45em 1em .45em .8em; border-radius:2em; cursor:pointer;
}
.d-title { margin-top:1.6vh; font-size:1.5rem; font-weight:700; letter-spacing:.1em; text-shadow:0 .1rem .3rem rgba(0,70,60,.35); }
.d-sub { margin-top:.5vh; font-size:.74rem; letter-spacing:.14em; opacity:.9; }

.d-scroll {
  flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding:0 4vw calc(env(safe-area-inset-bottom,0px) + 2vh);
  overscroll-behavior:contain;
}

.sup-card {
  background:linear-gradient(135deg,#fff7ed,#ffedd5);
  border:1px solid #fed7aa;
  border-radius:1rem;
  padding:.9rem 1rem;
  margin-bottom:.9rem;
  box-shadow:0 .3rem 1rem rgba(180,120,40,.12);
}
.sup-card .lab { font-size:.72rem; color:#b45309; letter-spacing:.16em; display:flex; align-items:center; gap:.4em; }
.sup-card .nums { margin-top:.45rem; display:flex; flex-wrap:wrap; gap:.5rem; }
.sup-card a {
  display:inline-flex; align-items:center; gap:.4em;
  background:#fff; border:1px solid #fdba74; border-radius:2em;
  color:#c2410c; font-weight:700; font-size:.95rem;
  padding:.35em .9em;
  box-shadow:0 .1rem .3rem rgba(194,65,12,.12);
}

.station-card {
  background:#fff; border-radius:1rem;
  box-shadow:0 .4rem 1.4rem rgba(10,90,80,.10);
  overflow:hidden;
}
.station-card .cap {
  padding:.7rem 1rem;
  font-size:.72rem; color:#6b8f89; letter-spacing:.14em;
  border-bottom:1px dashed #d5eae6;
  display:flex; justify-content:space-between;
}
.station-row {
  display:flex; align-items:center; gap:.8rem;
  padding:.85rem 1rem;
  border-bottom:1px solid #f0f7f5;
}
.station-row:last-child { border-bottom:none; }
.station-row:active { background:#eefaf7; }
.station-row .pin { flex:0 0 auto; }
.station-row .info { flex:1; min-width:0; }
.station-row .nm { font-size:.98rem; font-weight:600; color:#173b36; }
.station-row .tl { margin-top:.18rem; font-size:.84rem; color:#0a8a78; font-weight:700; letter-spacing:.04em; font-variant-numeric:tabular-nums; }
.call-btn {
  flex:0 0 auto;
  display:flex; align-items:center; gap:.35em;
  background:linear-gradient(135deg,#10b981,#0a8a78);
  color:#fff; font-size:.76rem; font-weight:600; letter-spacing:.08em;
  padding:.5em .95em; border-radius:2em;
  box-shadow:0 .2rem .5rem rgba(10,138,120,.3);
}
.call-btn svg { width:.8rem; height:.8rem; }

.d-tip {
  text-align:center; color:#8fb3ac; font-size:.7rem; letter-spacing:.12em;
  padding:1rem 0 .4rem;
}
</style>
</head>

<script>
/* ================= 页面导航 ================= */
var pCover = document.getElementById('page-cover');
var pMap = document.getElementById('page-map');
var pDetail = document.getElementById('page-detail');

function goMap() {
  pCover.classList.add('away');
  pMap.classList.add('show');
}
function goCover() {
  pCover.classList.remove('away');
  pMap.classList.remove('show');
}
document.getElementById('btn-flip').addEventListener('click', goMap);

/* 上滑翻页 / 下滑返回 */
(function () {
  var sx = 0, sy = 0, tracking = false;
  document.addEventListener('touchstart', function (e) {
    if (pDetail.classList.contains('show')) return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; tracking = true;
  }, {passive:true});
  document.addEventListener('touchend', function (e) {
    if (!tracking) return; tracking = false;
    var dy = e.changedTouches[0].clientY - sy;
    if (dy < -60 && !pMap.classList.contains('show')) goMap();
    else if (dy > 60 && pMap.classList.contains('show')) goCover();
  }, {passive:true});
})();

/* 注入真实地图 */
document.getElementById('map-root').innerHTML = MAP_SVG_INNER;

/* 地图区域点击 → 详情页 */
document.getElementById('xian-map').addEventListener('click', function (e) {
  var g = e.target.closest('.region');
  if (!g) return;
  var key = g.getAttribute('data-key');
  if (key) openDetail(key);
});

/* ================= 详情页 ================= */
var dTitle = document.getElementById('d-title');
var dSub = document.getElementById('d-sub');
var dScroll = document.getElementById('d-scroll');

function fmtTel(t) {
  return t.length > 8 ? t.slice(0,3) + '-' + t.slice(3) : t;
}

function openDetail(key) {
  var d = null;
  for (var i = 0; i < DATA.length; i++) if (DATA[i].key === key) { d = DATA[i]; break; }
  if (!d) return;

  dTitle.textContent = d.district;
  dSub.textContent = '属地供电所值班电话 · 共 ' + d.stations.length + ' 个网点';

  var html = '';
  if (d.supervise) {
    var nums = d.supervise.split('/').map(function (s) { return s.trim(); }).filter(Boolean);
    html += '<div class="sup-card"><div class="lab">' +
      '<svg width="12" height="12" viewBox="0 0 24 24" fill="#b45309"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-1.2 5h2.4v7h-2.4V7zm0 9.2h2.4v2.4h-2.4v-2.4z"/></svg>' +
      '电力服务监督电话</div><div class="nums">' +
      nums.map(function (n) {
        var pure = n.replace(/[^0-9]/g,'');
        return '<a href="tel:' + pure + '">' +
          '<svg width="13" height="13" viewBox="0 0 24 24" fill="#c2410c"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg>' +
          n + '</a>';
      }).join('') +
      '</div></div>';
  }

  html += '<div class="station-card"><div class="cap"><span>供电所名称</span><span>值班电话 · 点击拨打</span></div>';
  d.stations.forEach(function (s) {
    html += '<a class="station-row" href="tel:' + s.tel + '">' +
      '<span class="pin"></span>' +
      '<span class="info"><span class="nm">' + s.name + '</span><br><span class="tl">' + fmtTel(s.tel) + '</span></span>' +
      '<span class="call-btn"><svg viewBox="0 0 24 24" fill="#fff"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg>拨打</span>' +
      '</a>';
  });
  html += '</div><div class="d-tip">以上电话为国网西安供电公司对外公示属地值班电话</div>';

  dScroll.innerHTML = html;
  dScroll.scrollTop = 0;
  pDetail.classList.add('show');
}

document.getElementById('btn-back').addEventListener('click', function () {
  pDetail.classList.remove('show');
});

/* 禁止双击缩放/长按弹窗干扰 */
document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
</script>
